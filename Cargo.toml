[package]
name = "cankoro"
version = "0.1.0"
edition = "2021"
description = "CAN/CAN-FD Analysis Application using Vector VN1630/VN1640"

[dependencies]
eframe = "0.31"
egui = "0.31"
egui_plot = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
byteorder = "1"
nom = "7"
log = "0.4"
env_logger = "0.11"
rfd = "0.15"
flate2 = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
] }
winapi = { version = "0.3", features = ["synchapi", "winnt", "handleapi"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
